services:
  db:
    image: postgres:17
    container_name: sports_events_db
    environment:
      POSTGRES_DB: sports_events
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - "55432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab -d sports_events"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
